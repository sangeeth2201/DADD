# Save this file as:  .github/workflows/deploy.yml
# Then in your repo: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]        # change to "master" if that is your branch name
  workflow_dispatch:         # lets you also run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .            # folder that contains index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
